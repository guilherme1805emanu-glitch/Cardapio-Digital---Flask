<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {% block title %}Document{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">


</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <img class="mx-auto d-block img-fluid" style="max-width: 150px;"
                src="/static/logoMarca-removebg-preview.png" alt="">
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link fw-bold" aria-current="page" href="/">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" aria-current="page" href="/pizzas">Pizzas
                            </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="/promocoes">Promoções</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="/bebidas">Bebidas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="/pontuação">Pontuação</a>
                    </li>

                </ul>
            </div>
            <i class="bi bi-cart-plus"></i>
        </div>
    </nav>



    <footer class="bg-primary text-white text-center p-1 fixed-bottom">
        <p>Cardápio Digital criado por Emanuel FullStack - (85)981918445 <br> © 2026 Cardápio Digital. Todos os direitos
            reservados.</p>
    </footer>
    
    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
